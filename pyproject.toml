[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-finops-audit"
version = "0.1.0"
description = "Read-only CLI that finds common AWS cost waste and estimates monthly savings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[ec2,elbv2,cloudwatch]>=5"]

[project.scripts]
finops-audit = "finops_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
